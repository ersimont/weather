<mat-toolbar>
  <button mat-icon-button (click)="sidenav.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="title">{{ title() }}</span>

  <button mat-icon-button class="day" (click)="setRange(1, 'click_day')">
    <mat-icon svgIcon="day" />
  </button>
  <button
    mat-icon-button
    class="three-days"
    (click)="setRange(3, 'click_three_days')"
  >
    <mat-icon svgIcon="three-days" />
  </button>
  <button mat-icon-button class="week" (click)="setRange(7, 'click_week')">
    <mat-icon svgIcon="week" />
  </button>

  @if (httpStatusService.hasInFlightRequest()) {
    <mat-progress-bar mode="indeterminate" />
  }
</mat-toolbar>

<mat-sidenav-container>
  <mat-sidenav #sidenav>
    <div class="sidenav-content">
      <app-options />
      <mat-action-list>
        <button mat-list-item (click)="showAbout()">About</button>
        <button mat-list-item (click)="showPrivacyPolicy()">
          Privacy Policy
        </button>
      </mat-action-list>
    </div>
  </mat-sidenav>
  <mat-sidenav-content>
    @defer (on immediate) {
      <app-graph />
    }
  </mat-sidenav-content>
</mat-sidenav-container>
